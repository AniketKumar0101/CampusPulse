<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Icon -->
  <g transform="translate(10, 8)">
    <rect width="44" height="44" rx="12" fill="url(#logoGrad)" filter="drop-shadow(0 4px 12px rgba(255,107,53,0.45))"/>
    <!-- Compass radar & pulse -->
    <circle cx="22" cy="22" r="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <polygon points="22,12 26,22 22,20 18,22" fill="#ffffff"/>
    <polygon points="22,32 26,22 22,24 18,22" fill="#fed7aa"/>
    <circle cx="22" cy="22" r="3" fill="#ffffff"/>
  </g>
  <!-- Text -->
  <text x="66" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">Campus<tspan fill="#ff7a45">Pulse</tspan></text>
  <text x="67" y="47" fill="#94a3b8" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="1.2px">NAV &amp; INCIDENT COMMAND</text>
</svg>
